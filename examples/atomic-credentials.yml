# Replace the existing credential-provider row; do not append a second credentials service.
# Preserve its actual id and existing path/dshHome/watch/debounceMs configuration.
# Every profile/process writing these refs must use this provider against the same store.
- id: credentials
  name: '@jeweis/dsh-sync/credentials-provider'
  config:
    managedRefs:
      - DEEPSEEK_API_KEY
      - OPENAI_API_KEY
